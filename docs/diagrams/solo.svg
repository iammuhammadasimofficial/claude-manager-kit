<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6878"/></marker></defs><rect width="1280" height="720" rx="16" fill="#fbfaf7"/><text x="40" y="52" font-size="26" font-weight="700" fill="#1d1b26" text-anchor="start">Solo</text><text x="40" y="80" font-size="15" font-weight="400" fill="#6b6878" text-anchor="start">One Claude account on one machine. The manager does the work through subagents.</text><rect x="250" y="110" width="760" height="520" rx="18" fill="#f2efe8" stroke="#cfcbd8" stroke-width="1.4"/><text x="268" y="136" font-size="12" font-weight="700" fill="#6b6878" text-anchor="start">THIS MACHINE  |  ONE CLAUDE ACCOUNT</text><circle cx="120" cy="330" r="34" fill="#d97757"/><text x="120" y="336" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">You</text><text x="120" y="388" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">rate, approve, decide</text><rect x="420" y="150" width="320" height="84" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="1.6"/><text x="580.0" y="188.0" font-size="15" font-weight="700" fill="#d97757" text-anchor="middle">Manager session</text><text x="580.0" y="208.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">Claude Code Desktop  |  triage, routing, replies</text><rect x="686" y="139" width="46" height="22" rx="11" fill="#d97757"/><text x="709.0" y="154" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Opus</text><rect x="290" y="330" width="200" height="70" rx="12" fill="#ffffff" stroke="#2f7de1" stroke-width="1.6"/><text x="390.0" y="361.0" font-size="15" font-weight="700" fill="#2f7de1" text-anchor="middle">Dev subagent</text><text x="390.0" y="381.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">builds a ticket</text><rect x="422" y="319" width="60" height="22" rx="11" fill="#2f7de1"/><text x="452.0" y="334" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Sonnet</text><rect x="520" y="330" width="200" height="70" rx="12" fill="#ffffff" stroke="#7c4dda" stroke-width="1.6"/><text x="620.0" y="361.0" font-size="15" font-weight="700" fill="#7c4dda" text-anchor="middle">Review subagent</text><text x="620.0" y="381.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">reviews a PR</text><rect x="652" y="319" width="60" height="22" rx="11" fill="#7c4dda"/><text x="682.0" y="334" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Sonnet</text><rect x="750" y="330" width="200" height="70" rx="12" fill="#ffffff" stroke="#1f9d63" stroke-width="1.6"/><text x="850.0" y="361.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle">Mechanical</text><text x="850.0" y="381.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">git, tickets, posting</text><rect x="889" y="319" width="53" height="22" rx="11" fill="#1f9d63"/><text x="915.5" y="334" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Haiku</text><rect x="420" y="480" width="320" height="64" rx="12" fill="#ffffff" stroke="#1d1b26" stroke-width="1.6"/><text x="580.0" y="508.0" font-size="15" font-weight="700" fill="#1d1b26" text-anchor="middle">Work board</text><text x="580.0" y="528.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">kept current by the manager</text><rect x="705" y="560" width="250" height="58" rx="12" fill="#ffffff" stroke="#c98a12" stroke-width="1.6"/><text x="830.0" y="585.0" font-size="15" font-weight="700" fill="#c98a12" text-anchor="middle">Portable home folder</text><text x="830.0" y="605.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">playbook, rules, tone, memory, board</text><path d="M156,322 L418,200" stroke="#d9775