<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b6878"/></marker></defs><rect width="1280" height="720" rx="16" fill="#fbfaf7"/><text x="40" y="52" font-size="26" font-weight="700" fill="#1d1b26" text-anchor="start">Multi-machine</text><text x="40" y="80" font-size="15" font-weight="400" fill="#6b6878" text-anchor="start">Other computers you own run leads over SSH. Heavy builds and tests move off your laptop.</text><rect x="230" y="110" width="470" height="540" rx="18" fill="#f2efe8" stroke="#cfcbd8" stroke-width="1.4"/><text x="248" y="136" font-size="12" font-weight="700" fill="#6b6878" text-anchor="start">LAPTOP</text><rect x="760" y="110" width="480" height="540" rx="18" fill="#f2efe8" stroke="#cfcbd8" stroke-width="1.4" stroke-dasharray="6 5"/><text x="778" y="136" font-size="12" font-weight="700" fill="#6b6878" text-anchor="start">REMOTE MACHINE  (e.g. Beast, over SSH)</text><circle cx="110" cy="240" r="34" fill="#d97757"/><text x="110" y="246" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">You</text><text x="110" y="298" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">rate, approve, decide</text><rect x="260" y="160" width="410" height="84" rx="12" fill="#ffffff" stroke="#d97757" stroke-width="1.6"/><text x="465.0" y="198.0" font-size="15" font-weight="700" fill="#d97757" text-anchor="middle">Manager session</text><text x="465.0" y="218.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">Desktop  |  debugging, merges, messages</text><rect x="616" y="149" width="46" height="22" rx="11" fill="#d97757"/><text x="639.0" y="164" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Opus</text><rect x="260" y="270" width="410" height="44" rx="12" fill="#ffffff" stroke="#1d1b26" stroke-width="1.6"/><text x="465.0" y="292.0" font-size="15" font-weight="700" fill="#1d1b26" text-anchor="middle">Work board  |  laptop + remote limits, CPU</text><rect x="250" y="350" width="430" height="280" rx="18" fill="#f3eefc" stroke="#cfcbd8" stroke-width="1.4" stroke-dasharray="6 5"/><text x="268" y="376" font-size="12" font-weight="700" fill="#6b6878" text-anchor="start">ACCOUNT 2 ON THE LAPTOP (optional)</text><rect x="280" y="395" width="370" height="60" rx="12" fill="#ffffff" stroke="#2f7de1" stroke-width="1.6"/><text x="465.0" y="421.0" font-size="15" font-weight="700" fill="#2f7de1" text-anchor="middle">Wolf lead</text><text x="465.0" y="441.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">feature work</text><rect x="582" y="384" width="60" height="22" rx="11" fill="#2f7de1"/><text x="612.0" y="399" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Sonnet</text><rect x="280" y="475" width="175" height="56" rx="12" fill="#ffffff" stroke="#2f7de1" stroke-width="1.6"/><text x="367.5" y="503.0" font-size="15" font-weight="700" fill="#2f7de1" text-anchor="middle">dev job</text><rect x="475" y="475" width="175" height="56" rx="12" fill="#ffffff" stroke="#2f7de1" stroke-width="1.6"/><text x="562.5" y="503.0" font-size="15" font-weight="700" fill="#2f7de1" text-anchor="middle">review job</text><rect x="330" y="555" width="250" height="58" rx="12" fill="#ffffff" stroke="#c98a12" stroke-width="1.6"/><text x="455.0" y="580.0" font-size="15" font-weight="700" fill="#c98a12" text-anchor="middle">Portable home folder</text><text x="455.0" y="600.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">playbook, rules, tone, memory, board</text><rect x="800" y="170" width="400" height="70" rx="12" fill="#ffffff" stroke="#7c4dda" stroke-width="1.6"/><text x="1000.0" y="201.0" font-size="15" font-weight="700" fill="#7c4dda" text-anchor="middle">Beast lead</text><text x="1000.0" y="221.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">runs claude -p on its own machine</text><rect x="1132" y="159" width="60" height="22" rx="11" fill="#7c4dda"/><text x="1162.0" y="174" font-size="11" font-weight="600" fill="#fff" text-anchor="middle">Sonnet</text><rect x="800" y="270" width="190" height="60" rx="12" fill="#ffffff" stroke="#7c4dda" stroke-width="1.6"/><text x="895.0" y="296.0" font-size="15" font-weight="700" fill="#7c4dda" text-anchor="middle">dev job</text><text x="895.0" y="316.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">own worktree on SSD</text><rect x="1010" y="270" width="190" height="60" rx="12" fill="#ffffff" stroke="#7c4dda" stroke-width="1.6"/><text x="1105.0" y="296.0" font-size="15" font-weight="700" fill="#7c4dda" text-anchor="middle">review job</text><text x="1105.0" y="316.0" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">targeted tests</text><rect x="800" y="360" width="400" height="50" rx="12" fill="#ffffff" stroke="#1d1b26" stroke-width="1.6"/><text x="1000.0" y="385.0" font-size="15" font-weight="700" fill="#1d1b26" text-anchor="middle">Repos, builds and tests run here</text><rect x="800" y="430" width="400" height="50" rx="12" fill="#ffffff" stroke="#c98a12" stroke-width="1.6"/><text x="1000.0" y="455.0" font-size="15" font-weight="700" fill="#c98a12" text-anchor="middle">Load gate: CPU and disk checked first</text><rect x="800" y="500" width="400" height="50" rx="12" fill="#ffffff" stroke="#1f9d63" stroke-width="1.6"/><text x="1000.0" y="525.0" font-size="15" font-weight="700" fill="#1f9d63" text-anchor="middle">Results and history copied back</text><text x="1000" y="600" font-size="13" font-weight="600" fill="#6b6878" text-anchor="middle">Set up with:  npx claude-manager-kit join</text><path d="M146,236 L258,210" stroke="#d97757" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="182.8" y="210.0" width="38.4" height="20" rx="6" fill="#fbfaf7"/><text x="202.0" y="225.0" font-size="12" font-weight="500" fill="#d97757" text-anchor="middle">asks</text><path d="M672,200 L798,200" stroke="#d97757" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="699.3" y="187.0" width="71.4" height="20" rx="6" fill="#fbfaf7"/><text x="735.0" y="202.0" font-size="12" font-weight="500" fill="#d97757" text-anchor="middle">SSH brief</text><path d="M798,525 L672,300" stroke="#1f9d63" stroke-width="1.8" fill="none" marker-end="url(#a)" stroke-dasharray="6 5"/><rect x="705.9" y="407" width="58.199999999999996" height="20" rx="6" fill="#fbfaf7"/><text x="735" y="422" font-size="12" font-weight="500" fill="#1f9d63" text-anchor="middle">results</text><path d="M465,316 L465,393" stroke="#d97757" stroke-width="1.8" fill="none" marker-end="url(#a)"/><rect x="439.2" y="341.5" width="51.599999999999994" height="20" rx="6" fill="#fbfaf7"/><text x="465.0" y="356.5" font-size="12" font-weight="500" fill="#d97757" text-anchor="middle">briefs</text><text x="640.0" y="698" font-size="12" font-weight="400" fill="#6b6878" text-anchor="middle">Mix freely: accounts and machines. SSH uses your own keys; no passwords are stored.</text></svg>