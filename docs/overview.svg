<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 760" width="1280" height="760" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1222"/>
      <stop offset="1" stop-color="#1a1530"/>
    </linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d97757"/>
      <stop offset="1" stop-color="#f0a46b"/>
    </linearGradient>
    <filter id="sh" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f0a46b"/>
    </marker>
  </defs>

  <rect width="1280" height="760" fill="url(#bg)"/>

  <!-- Title -->
  <text x="40" y="58" font-size="30" font-weight="700" fill="#ffffff">claude-manager-kit</text>
  <text x="330" y="58" font-size="18" fill="#b8b4d6">One manager session. Parallel leads. A live board. No API keys.</text>
  <rect x="40" y="72" width="120" height="4" rx="2" fill="url(#acc)"/>

  <!-- Manager session -->
  <g filter="url(#sh)">
    <rect x="40" y="100" width="400" height="430" rx="14" fill="#171a2e" stroke="#2c3050"/>
    <rect x="40" y="100" width="400" height="44" rx="14" fill="#20243d"/>
    <rect x="40" y="130" width="400" height="14" fill="#20243d"/>
    <circle cx="62" cy="122" r="6" fill="#ff5f57"/><circle cx="82" cy="122" r="6" fill="#febc2e"/><circle cx="102" cy="122" r="6" fill="#28c840"/>
    <text x="124" y="127" font-size="15" font-weight="600" fill="#ffffff">Manager session</text>
    <rect x="350" y="111" width="76" height="22" rx="11" fill="#3a2a22"/>
    <text x="388" y="127" font-size="12" fill="#f0a46b" text-anchor="middle">Opus</text>

    <text x="60" y="172" font-size="12" fill="#8a87ab" letter-spacing="1">INTAKE</text>
    <g font-size="13">
      <rect x="60" y="182" width="360" height="40" rx="8" fill="#1f2340"/>
      <circle cx="76" cy="202" r="5" fill="#5aa9ff"/>
      <text x="90" y="200" fill="#e7e5f7">Chat: "Can you review PR #142?"</text>
      <text x="90" y="215" font-size="11" fill="#8a87ab">routed to Review lead</text>

      <rect x="60" y="230" width="360" height="40" rx="8" fill="#1f2340"/>
      <circle cx="76" cy="250" r="5" fill="#b388ff"/>
      <text x="90" y="248" fill="#e7e5f7">Ticket: "Add export to reports"</text>
      <text x="90" y="263" font-size="11" fill="#8a87ab">plan written, sent to Dev lead</text>

      <rect x="60" y="278" width="360" height="40" rx="8" fill="#1f2340"/>
      <circle cx="76" cy="298" r="5" fill="#4cd38a"/>
      <text x="90" y="296" fill="#e7e5f7">Email from client</text>
      <text x="90" y="311" font-size="11" fill="#8a87ab">draft ready in your tone</text>
    </g>

    <text x="60" y="346" font-size="12" fill="#8a87ab" letter-spacing="1">ASKS YOU ONLY WHAT MATTERS</text>
    <rect x="60" y="356" width="360" height="74" rx="10" fill="#2a2036" stroke="#5b3d4a"/>
    <text x="76" y="380" font-size="13" fill="#ffffff">Deploy release 2.4 to production?</text>
    <rect x="76" y="394" width="98" height="26" rx="13" fill="url(#acc)"/>
    <text x="125" y="412" font-size="12" font-weight="600" fill="#1a1530" text-anchor="middle">Go ahead</text>
    <rect x="184" y="394" width="76" height="26" rx="13" fill="none" stroke="#6b6890"/>
    <text x="222" y="412" font-size="12" fill="#c9c6e6" text-anchor="middle">Later</text>

    <text x="60" y="458" font-size="12" fill="#8a87ab" letter-spacing="1">LEARNS FROM YOUR RATINGS</text>
    <rect x="60" y="468" width="174" height="44" rx="8" fill="#1c2e27"/>
    <text x="74" y="488" font-size="13" fill="#4cd38a">+ good</text>
    <text x="74" y="504" font-size="11" fill="#9fc9b4">keeps doing it</text>
    <rect x="246" y="468" width="174" height="44" rx="8" fill="#33202a"/>
    <text x="260" y="488" font-size="13" fill="#ff7a8a">- bad</text>
    <text x="260" y="504" font-size="11" fill="#d7a5ae">new rule, never repeats</text>
  </g>

  <!-- Board -->
  <g filter="url(#sh)">
    <rect x="470" y="100" width="770" height="300" rx="14" fill="#171a2e" stroke="#2c3050"/>
    <text x="492" y="132" font-size="15" font-weight="600" fill="#ffffff">Live work board</text>
    <text x="1218" y="132" font-size="12" fill="#8a87ab" text-anchor="end">refreshes every 15 min</text>

    <g font-size="12">
      <!-- columns -->
      <text x="492" y="164" fill="#8a87ab" letter-spacing="1">COMING UP</text>
      <text x="680" y="164" fill="#8a87ab" letter-spacing="1">IN DEVELOPMENT</text>
      <text x="868" y="164" fill="#8a87ab" letter-spacing="1">IN REVIEW</text>
      <text x="1056" y="164" fill="#8a87ab" letter-spacing="1">WAITING ON YOU</text>

      <rect x="490" y="174" width="176" height="56" rx="8" fill="#1f2340"/>
      <text x="502" y="196" fill="#e7e5f7">Export to reports</text>
      <text x="502" y="216" fill="#8a87ab">planned, P2</text>
      <rect x="490" y="238" width="176" height="56" rx="8" fill="#1f2340"/>
      <text x="502" y="260" fill="#e7e5f7">Onboarding emails</text>
      <text x="502" y="280" fill="#8a87ab">ticket groomed</text>

      <rect x="678" y="174" width="176" height="56" rx="8" fill="#1f2340" stroke="#5aa9ff" stroke-opacity="0.5"/>
      <text x="690" y="196" fill="#e7e5f7">Search filters</text>
      <text x="690" y="216" fill="#5aa9ff">Wolf lead, Sonnet</text>
      <rect x="678" y="238" width="176" height="56" rx="8" fill="#1f2340" stroke="#b388ff" stroke-opacity="0.5"/>
      <text x="690" y="260" fill="#e7e5f7">Checkout fix</text>
      <text x="690" y="280" fill="#b388ff">Beast lead, Sonnet</text>

      <rect x="866" y="174" width="176" height="56" rx="8" fill="#1f2340"/>
      <text x="878" y="196" fill="#e7e5f7">PR #142 login limits</text>
      <text x="878" y="216" fill="#4cd38a">approved, merging</text>
      <rect x="866" y="238" width="176" height="56" rx="8" fill="#1f2340"/>
      <text x="878" y="260" fill="#e7e5f7">PR #139 report UI</text>
      <text x="878" y="280" fill="#8a87ab">2 fixes pushed</text>

      <rect x="1054" y="174" width="168" height="56" rx="8" fill="#2a2036" stroke="#5b3d4a"/>
      <text x="1066" y="196" fill="#e7e5f7">Release 2.4</text>
      <text x="1066" y="216" fill="#f0a46b">needs your go</text>
    </g>

    <!-- limits -->
    <text x="492" y="326" font-size="12" fill="#8a87ab" letter-spacing="1">ACCOUNT LIMITS</text>
    <g font-size="12" fill="#c9c6e6">
      <text x="492" y="352">Main</text>
      <rect x="550" y="342" width="170" height="10" rx="5" fill="#2a2e4a"/><rect x="550" y="342" width="70" height="10" rx="5" fill="#4cd38a"/>
      <text x="728" y="352">41%</text>
      <text x="772" y="352">Wolf</text>
      <rect x="822" y="342" width="170" height="10" rx="5" fill="#2a2e4a"/><rect x="822" y="342" width="106" height="10" rx="5" fill="#5aa9ff"/>
      <text x="1000" y="352">62%</text>
      <text x="1044" y="352">Beast</text>
      <rect x="1094" y="342" width="100" height="10" rx="5" fill="#2a2e4a"/><rect x="1094" y="342" width="30" height="10" rx="5" fill="#b388ff"/>
      <text x="1200" y="352">30%</text>
      <text x="492" y="380" font-size="11" fill="#8a87ab">5-hour and weekly usage of every account, with reset times. Work pauses at 85%.</text>
    </g>
  </g>

  <!-- Arrows manager -> leads -->
  <path d="M440 470 C 520 470, 520 560, 560 580" fill="none" stroke="#f0a46b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <path d="M440 490 C 700 500, 840 520, 900 576" fill="none" stroke="#f0a46b" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arr)"/>
  <text x="600" y="520" font-size="12" fill="#f0a46b">talks only to the leads</text>

  <!-- Lead: Wolf -->
  <g filter="url(#sh)">
    <rect x="470" y="584" width="370" height="140" rx="14" fill="#171a2e" stroke="#2c3050"/>
    <circle cx="496" cy="612" r="7" fill="#5aa9ff"/>
    <text x="512" y="617" font-size="15" font-weight="600" fill="#ffffff">Wolf lead</text>
    <text x="596" y="617" font-size="12" fill="#8a87ab">second account, this machine</text>
    <rect x="770" y="601" width="56" height="22" rx="11" fill="#1d2a3e"/>
    <text x="798" y="617" font-size="11" fill="#5aa9ff" text-anchor="middle">Sonnet</text>
    <g font-size="12">
      <rect x="490" y="636" width="160" height="34" rx="7" fill="#1f2340"/>
      <text x="502" y="657" fill="#e7e5f7">dev: search filters</text>
      <rect x="660" y="636" width="160" height="34" rx="7" fill="#1f2340"/>
      <text x="672" y="657" fill="#e7e5f7">review: PR #142</text>
      <rect x="490" y="678" width="160" height="34" rx="7" fill="#1f2340"/>
      <text x="502" y="699" fill="#8a87ab">git, tickets: Haiku</text>
      <rect x="660" y="678" width="160" height="34" rx="7" fill="#1c2e27"/>
      <text x="672" y="699" fill="#4cd38a">merges after review</text>
    </g>
  </g>

  <!-- Lead: Beast -->
  <g filter="url(#sh)">
    <rect x="870" y="584" width="370" height="140" rx="14" fill="#171a2e" stroke="#2c3050"/>
    <circle cx="896" cy="612" r="7" fill="#b388ff"/>
    <text x="912" y="617" font-size="15" font-weight="600" fill="#ffffff">Beast lead</text>
    <text x="1000" y="617" font-size="12" fill="#8a87ab">another machine, over SSH</text>
    <rect x="1170" y="601" width="56" height="22" rx="11" fill="#261d3e"/>
    <text x="1198" y="617" font-size="11" fill="#b388ff" text-anchor="middle">Sonnet</text>
    <g font-size="12">
      <rect x="890" y="636" width="160" height="34" rx="7" fill="#1f2340"/>
      <text x="902" y="657" fill="#e7e5f7">dev: checkout fix</text>
      <rect x="1060" y="636" width="160" height="34" rx="7" fill="#1f2340"/>
      <text x="1072" y="657" fill="#e7e5f7">review: PR #139</text>
      <rect x="890" y="678" width="160" height="34" rx="7" fill="#1f2340"/>
      <text x="902" y="699" fill="#8a87ab">tests, targeted only</text>
      <rect x="1060" y="678" width="160" height="34" rx="7" fill="#1c2e27"/>
      <text x="1072" y="699" fill="#4cd38a">small PRs, no AI tags</text>
    </g>
  </g>

  <!-- Tools strip -->
  <g filter="url(#sh)">
    <rect x="40" y="556" width="400" height="168" rx="14" fill="#171a2e" stroke="#2c3050"/>
    <text x="60" y="586" font-size="12" fill="#8a87ab" letter-spacing="1">YOUR TOOLS, OFFICIAL CONNECTORS</text>
    <g font-size="12" fill="#e7e5f7">
      <rect x="60" y="600" width="112" height="30" rx="15" fill="#1f2340"/><text x="116" y="620" text-anchor="middle">Chat</text>
      <rect x="184" y="600" width="112" height="30" rx="15" fill="#1f2340"/><text x="240" y="620" text-anchor="middle">Email</text>
      <rect x="308" y="600" width="112" height="30" rx="15" fill="#1f2340"/><text x="364" y="620" text-anchor="middle">Tickets</text>
      <rect x="60" y="640" width="112" height="30" rx="15" fill="#1f2340"/><text x="116" y="660" text-anchor="middle">GitHub</text>
      <rect x="184" y="640" width="112" height="30" rx="15" fill="#1f2340"/><text x="240" y="660" text-anchor="middle">Calendar</text>
      <rect x="308" y="640" width="112" height="30" rx="15" fill="#1f2340"/><text x="364" y="660" text-anchor="middle">Meetings</text>
    </g>
    <text x="60" y="700" font-size="12" fill="#b8b4d6">Runs on the Claude plans you already have.</text>
  </g>

  <text x="640" y="748" font-size="12" fill="#6b6890" text-anchor="middle">Best in Claude Code Desktop  |  Windows, macOS, Linux  |  npx claude-manager-kit</text>
</svg>
