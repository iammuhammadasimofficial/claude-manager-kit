xt><circle cx="304" cy="240" r="3" fill="#f0a46b"/><text x="314" y="244" font-size="13" font-weight="400" fill="#ececf1" text-anchor="start">Wolf lead planned it in 3 small PRs and started a dev job.</text><circle cx="304" cy="261" r="3" fill="#f0a46b"/><text x="314" y="265" font-size="13" font-weight="400" fill="#ececf1" text-anchor="start">Falcon stays on the payments review (71%, resets 16:00).</text><circle cx="304" cy="282" r="3" fill="#f0a46b"/><text x="314" y="286" font-size="13" font-weight="400" fill="#ececf1" text-anchor="start">I will tell you when the first PR is up for review.</text><rect x="702.8" y="304" width="183.20000000000002" height="38" rx="12" fill="#2b2b33"/><text x="718.8" y="328" font-size="13" font-weight="400" fill="#ececf1" text-anchor="start">Good. Anything stuck?</text><text x="294" y="373" font-size="13" font-weight="400" fill="#ececf1" text-anchor="start">One question from Falcon lead:</text><text x="294" y="394" font-size="13" font-weight="400" fill="#ececf1" text-anchor="start">&quot;Refunds: partial refund allowed after 7 days?&quot;</text><rect x="294" y="412" width="592" height="86" rx="10" fill="#262030" stroke="#4a3442"/><text x="312" y="440" font-size="13" font-weight="600" fill="#ececf1" text-anchor="start">Allow partial refunds after 7 days?</text><rect x="312" y="456" width="50.2" height="28" rx="14" fill="#d97757"/><text x="337.1" y="475" font-size="12" font-weight="600" fill="#1a1310" text-anchor="middle">Yes</text><rect x="372.2" y="456" width="42.8" height="28" rx="14" fill="none" stroke="#5b5b68"/><text x="393.59999999999997" y="475" font-size="12" font-weight="500" fill="#9a9aa6" text-anchor="middle">No</text><rect x="425.0" y="456" width="102.0" height="28" rx="14" fill="none" stroke="#5b5b68"/><text x="476.0" y="475" font-size="12" font-weight="500" fill="#9a9aa6" text-anchor="middle">Ask the PM</text><rect x="294" y="784" width="592" height="52" rx="14" fill="#26262d" stroke="#33333c"/><text x="314" y="815" font-size="13" font-weight="400" fill="#6f6f7a" text-anchor="start">Reply to your manager...</text><circle cx="858" cy="810" r="14" fill="#d97757"/><text x="858" y="815" font-size="14" font-weight="700" fill="#1a1310" text-anchor="middle">↑</text><rect x="910" y="40" width="530" height="820" rx="0" fill="#1f1f24"/><line x1="910" y1="40" x2="910" y2="860" stroke="#33333c"/><text x="930" y="72" font-size="15" font-weight="600" fill="#ececf1" text-anchor="start">Work board</text><text x="1420" y="72" font-size="11" font-weight="400" fill="#9a9aa6" text-anchor="end">updated 2 min ago</text><text x="930" y="96" font-size="10" font-weight="600" fill="#6f6f7a" text-anchor="start" letter-spacing="1">ACCOUNT LIMITS</text><text x="930" y="121" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="start">Main</text><rect x="1000" y="112" width="300" height="10" rx="5" fill="#2e2e37"/><rect x="1000" y="112" width="138.0" height="10" rx="5" fill="#4cd38a"/><text x="1310" y="121" font-size="12" font-weight="500" fill="#ececf1" text-anchor="start">46%</text><text x="1420" y="121" font-size="11" font-weight="400" fill="#6f6f7a" text-anchor="end">resets 14:00</text><text x="930" y="145" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="start">Wolf</text><rect x="1000" y="136" width="300" height="10" rx="5" fill="#2e2e37"/><rect x="1000" y="136" width="114.0" height="10" rx="5" fill="#5aa9ff"/><text x="1310" y="145" font-size="12" font-weight="500" fill="#ececf1" text-anchor="start">38%</text><text x="1420" y="145" font-size="11" font-weight="400" fill="#6f6f7a" text-anchor="end">resets 15:30</text><text x="930" y="169" font-size="12" font-weight="400" fill="#9a9aa6" text-anchor="start">Falcon</text><rect x="1000" y="160" width="300" height="10" rx="5" fill="#2e2e37"/><rect x="1000" y="160" width="213.0" height="10" rx="5" fill="#b388ff"/><text x="1310" y="169" font-size="12" font-weight="500" fill="#ececf1" text-anchor="start">71%</text><text x="1420" y="169" font-size="1